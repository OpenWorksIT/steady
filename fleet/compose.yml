# Steady fleet view on OpenWorks' own server (vps3), behind the Caddy in ops/compose.yml, on the
# fleet-edge network (only it and Caddy; the forum is on a network of its own). See
# docs/FLEET.md and docs/OPS-SERVER.md.
#   sudo install -d -m 700 -o 65532 -g 65532 /var/lib/steady-fleet
#   sudo docker compose -f fleet/compose.yml up -d --build
# SPDX-License-Identifier: AGPL-3.0-or-later
# each service's log (docker compose logs) is kept to 5 files of 10 MB, not without end
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  fleet:
    logging: *logging
    build: .
    restart: unless-stopped
    environment:
      FLEET_ADDR: ":8080"
      FLEET_DATA: /data
      # only Caddy's X-Forwarded-For is believed (its service name on fleet-edge)
      FLEET_TRUSTED_PROXY: caddy
    volumes:
      - /var/lib/steady-fleet:/data
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [edge]
    healthcheck:
      test: ["CMD", "/fleet", "healthz"]
      interval: 1m
      timeout: 5s

networks:
  edge:
    name: fleet-edge
    external: true
