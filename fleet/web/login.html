{{template "top" "Sign in"}}
<main class="narrow">
<h1>Steady fleet</h1>
<p class="muted">For OpenWorks IT. Sign in with your name, password and the code from your authenticator app.</p>
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
<form method="post" action="/login" class="stack" autocomplete="on">
<label>Name <input name="name" autocomplete="username" required autofocus></label>
<label>Password <input name="password" type="password" autocomplete="current-password" required></label>
<label>Code <input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label>
<button>Sign in</button>
</form>
</main>
{{template "end"}}
