# Builds the Android app bundle (.aab) for Google Play, signed with Steady's permanent key.
# Run it by hand (Actions > Store builds > Run workflow). It doesn't touch the beta: the APK and
# web app on the servers (web-dist) stay as they are.
#
# The bundle is attached to the "store-build" pre-release (download it there) to upload in
# Play Console. Each run's version code is higher than the last, as Play requires.
# SPDX-License-Identifier: AGPL-3.0-or-later
name: Store builds
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: store-builds
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    # the signing keys live in the "signing" environment, which only main and v1 may use
    # (Settings > Environments); a workflow on any other branch can't reach them
    environment: signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: generate platform folders
        working-directory: app
        run: |
          flutter create --org za.co.openworks --project-name steady --platforms android . > ../create.txt 2>&1
          rm -f test/widget_test.dart
          python3 scripts/patch_android.py

      - name: version and signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] || { echo "::error title=signing::Store builds need ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD."; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > app/android/app/steady-release.jks
          printf 'storeFile=steady-release.jks\nstorePassword=%s\nkeyAlias=steady\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > app/android/key.properties
          echo "STEADY_BUILD=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "STEADY_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          # beta APKs are version code 1; store builds start at 101 and always go up
          echo "VERSION_CODE=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$(grep '^version:' app/pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')" >> "$GITHUB_ENV"

      - name: build app bundle
        working-directory: app
        timeout-minutes: 40
        run: |
          set -o pipefail
          flutter build appbundle --release --build-name=$VERSION_NAME --build-number=$VERSION_CODE \
            --dart-define=STEADY_BUILD=$STEADY_BUILD --dart-define=STEADY_BUILD_DATE=$STEADY_BUILD_DATE --dart-define=STEADY_SERVER=${{ vars.STEADY_SERVER }} 2>&1 | tee ../aab.txt \
            || { echo "::error title=flutter build appbundle::$(sed 's/%/%25/g' ../aab.txt | grep -iE 'error|failed' | tail -c 20000 | awk '{printf "%s%%0A", $0}')"; exit 1; }
          cp build/app/outputs/bundle/release/app-release.aab ../steady-$VERSION_NAME-$VERSION_CODE.aab

      - name: publish to the store-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=steady-$VERSION_NAME-$VERSION_CODE.aab
          notes="Android app bundle for Google Play: version $VERSION_NAME ($VERSION_CODE), from ${GITHUB_SHA::7}. Upload it in Play Console. Signed with Steady's permanent key."
          if gh release view store-build > /dev/null 2>&1; then
            gh release delete-asset store-build "$(gh release view store-build --json assets --jq '.assets[0].name' 2>/dev/null)" -y > /dev/null 2>&1 || true
            gh release upload store-build "$f" --clobber
            gh release edit store-build --title "Store build $VERSION_NAME ($VERSION_CODE)" --notes "$notes" --prerelease
          else
            gh release create store-build "$f" --prerelease --target "$GITHUB_SHA" --title "Store build $VERSION_NAME ($VERSION_CODE)" --notes "$notes"
          fi
          echo "::notice title=Google Play::$f is on the store-build pre-release, ready to upload."
