# Builds an installable Android APK and the web app, and publishes them to the
# "test-build" pre-release. The APK asks for the server address on first launch.
# SPDX-License-Identifier: AGPL-3.0-or-later
name: Test builds
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/test-builds.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-builds
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: generate platform folders
        working-directory: app
        run: |
          flutter create --org za.co.openworks --project-name steady --platforms android,web . > ../create.txt 2>&1
          rm -f test/widget_test.dart
          python3 scripts/patch_android.py
          python3 scripts/patch_web.py

      - name: build apk
        working-directory: app
        timeout-minutes: 30
        run: |
          set -o pipefail
          # 64-bit ARM only: every current phone, and a third of the native (QR scanner) build time
          flutter build apk --release --target-platform android-arm64 2>&1 | tee ../apk.txt || { echo "::error title=flutter build apk::$(sed 's/%/%25/g' ../apk.txt | tail -c 60000 | awk '{printf "%s%%0A", $0}')"; exit 1; }

      - name: build web
        working-directory: app
        timeout-minutes: 20
        run: |
          set -o pipefail
          # free the memory the Android build's Gradle and Kotlin daemons keep holding
          (cd android && ./gradlew --stop) > /dev/null 2>&1 || true
          pkill -f KotlinCompileDaemon || true
          flutter build web --verbose --release --no-web-resources-cdn 2>&1 | tee ../web.txt || { echo "::error title=flutter build web::$(sed 's/%/%25/g' ../web.txt | tail -c 60000 | awk '{printf "%s%%0A", $0}')"; exit 1; }

      - name: package
        run: |
          mkdir -p out
          cp app/build/app/outputs/flutter-apk/app-release.apk out/steady-test.apk
          (cd app/build/web && zip -qr ../../../out/steady-web.zip .)
          ls -la out

      - name: publish the web app to the web-dist branch
        # servers fetch it with their read-only deploy key (deploy/update.sh)
        run: |
          cd app/build/web
          git init -q -b web-dist
          git -c user.name="OpenWorks IT" -c user.email="noreply@openworks.co.za" add -A
          git -c user.name="OpenWorks IT" -c user.email="noreply@openworks.co.za" commit -qm "Web app built from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" web-dist
          rm -rf .git

      - name: publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-build --yes --cleanup-tag 2>/dev/null || true
          gh release create test-build out/steady-test.apk out/steady-web.zip \
            --prerelease --target "$GITHUB_SHA" --title "Test build ($(date -u +%Y-%m-%d) ${GITHUB_SHA::7})" \
            --notes "For testing only. Install steady-test.apk on Android and enter your test server address on first launch. steady-web.zip is the web app served by deploy/test/start.sh."
