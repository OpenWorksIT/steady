name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test server/tests/*.test.js

  server-live:
    # Boots the real PocketBase with Steady's migrations and hooks and checks it starts cleanly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t steady-server server
      - run: |
          docker run -d --name pb -p 8090:8090 steady-server
          for i in $(seq 1 30); do curl -fsS localhost:8090/api/health && break; sleep 1; done
          curl -fsS localhost:8090/api/steady/config | tee /dev/stderr | grep -q crisisLines
          docker logs pb 2>&1 | tee pb.log
          ! grep -iE "error|panic|failed" pb.log

  e2e:
    # Starts the test stack (server, relay, caddy; no tunnel) and runs the full
    # clinician/patient flow against the real PocketBase.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: start test stack
        run: |
          set -o pipefail
          NO_TUNNEL=1 deploy/test/start.sh 2>&1 | tee start.txt || { echo "::error title=start.sh::$(sed 's/%/%25/g' start.txt | tail -c 30000 | awk '{printf "%s%%0A", $0}')"; exit 1; }
      - name: smoke test
        run: |
          set -o pipefail
          python3 deploy/test/smoke.py 2>&1 | tee smoke.txt || { echo "::error title=smoke test::$(sed 's/%/%25/g' smoke.txt | awk '{printf "%s%%0A", $0}')"; exit 1; }
      - name: deployment config is valid
        run: |
          set -o pipefail
          docker run --rm -v "$PWD/deploy/test/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile 2>&1 | tail -n 3
          docker run --rm -e STEADY_DOMAIN=steady.example.co.za -e ACME_EMAIL=it@example.co.za \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile 2>&1 | tail -n 3
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config -q
      - name: server log on failure
        if: failure()
        run: |
          docker compose -f deploy/test/compose.yml --env-file deploy/test/.env logs --no-color pocketbase pusher caddy > pb.log 2>&1 || true
          docker compose -f deploy/test/compose.yml --env-file deploy/test/.env ps -a >> pb.log 2>&1 || true
          echo "::warning title=server log::$(sed 's/%/%25/g; s/\r//g' pb.log | tail -c 20000 | awk '{printf "%s%%0A", $0}')"

  pusher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
      - run: cd pusher && go vet ./... && go test ./...

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Each step reports its full output as one annotation, so it can be read with
      # `gh run view` even where log downloads aren't available.
      - name: pub get
        working-directory: app
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee ../pubget.txt || { echo "::error title=flutter pub get::$(sed 's/%/%25/g' ../pubget.txt | tail -c 60000 | awk '{printf "%s%%0A", $0}')"; exit 1; }
      - name: analyze
        working-directory: app
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee ../analyze.txt || { echo "::error title=flutter analyze::$(sed 's/%/%25/g' ../analyze.txt | tail -c 60000 | awk '{printf "%s%%0A", $0}')"; exit 1; }
          if ! grep -q "No issues found" ../analyze.txt; then
            echo "::notice title=flutter analyze (infos)::$(sed 's/%/%25/g' ../analyze.txt | tail -c 60000 | awk '{printf "%s%%0A", $0}')"
          fi
      - name: test
        working-directory: app
        run: |
          set -o pipefail
          flutter test 2>&1 | tee ../test.txt || { echo "::error title=flutter test::$(sed 's/%/%25/g' ../test.txt | tail -c 60000 | awk '{printf "%s%%0A", $0}')"; exit 1; }
