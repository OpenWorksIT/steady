name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test server/tests/*.test.js

  server-live:
    # Boots the real PocketBase with Steady's migrations and hooks and checks it starts cleanly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t steady-server server
      - run: |
          docker run -d --name pb -p 8090:8090 steady-server
          for i in $(seq 1 30); do curl -fsS localhost:8090/api/health && break; sleep 1; done
          curl -fsS localhost:8090/api/steady/config | tee /dev/stderr | grep -q crisisLines
          docker logs pb 2>&1 | tee pb.log
          ! grep -iE "error|panic|failed" pb.log

  e2e:
    # Starts the test stack (server, relay, caddy; no tunnel) and runs the full
    # clinician/patient flow against the real PocketBase.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: start test stack
        run: |
          set -o pipefail
          NO_TUNNEL=1 deploy/test/start.sh 2>&1 | tee start.txt || { echo "::error title=start.sh::$(sed 's/%/%25/g' start.txt | tail -c 30000 | awk '{printf "%s%%0A", $0}')"; exit 1; }
      - name: security tests
        # tries to reach what each kind of account must not: other patients, other
        # psychologists' patients, hidden fields, admin views of clinical data, the dashboard
        run: |
          set -o pipefail
          python3 deploy/test/security.py 2>&1 | tee security.txt || { echo "::error title=security tests::$(grep -A1 '^FAIL' security.txt | sed 's/%/%25/g' | tail -c 30000 | awk '{printf "%s%%0A", $0}')"; exit 1; }
          tail -1 security.txt
      - name: penetration tests
        # every route as every kind of account, PocketBase's own API (batch, realtime, filters,
        # expand), forged tokens, oversized and malformed input, account enumeration
        run: |
          set -o pipefail
          python3 deploy/test/pentest.py 2>&1 | tee pentest.txt || { echo "::error title=penetration tests::$(grep -A1 '^FAIL' pentest.txt | sed 's/%/%25/g' | tail -c 30000 | awk '{printf "%s%%0A", $0}')"; exit 1; }
          tail -1 pentest.txt
      - name: smoke test
        run: |
          set -o pipefail
          python3 deploy/test/smoke.py 2>&1 | tee smoke.txt || { echo "::error title=smoke test::$(sed 's/%/%25/g' smoke.txt | awk '{printf "%s%%0A", $0}')"; exit 1; }
      - name: move the data to a vps1-style server
        # export from the test stack, restore into the production compose behind a proxy
        # (as on vps1), then sign in with the same account
        run: |
          set -o pipefail
          bash -euxo pipefail <<'SH' 2>&1 | tee move.txt || { echo "::error title=move data::$(tail -c 20000 move.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit 1; }
          deploy/test/export-data.sh /tmp/steady-data.tar.gz
          docker network create edge
          cd deploy
          cp .env.example .env
          sed -i 's/^PUSHER_SECRET=.*/PUSHER_SECRET=ci-relay-secret-ci-relay-secret-1234/' .env
          echo 'COMPOSE_FILE=docker-compose.yml:behind-proxy.yml' >> .env
          sudo ./gen-keys.sh > /dev/null
          mkdir -p web
          docker compose up -d --build > up.txt 2>&1 || { cat up.txt; exit 1; }
          for i in $(seq 1 30); do curl -fsS 127.0.0.1:8091/api/health > /dev/null && break; sleep 2; done
          echo yes | ./restore-data.sh /tmp/steady-data.tar.gz
          python3 - <<'PY'
          import json, re, urllib.request
          env = dict(re.findall(r'^([A-Z_]+)="?([^"\n]*)"?$', open("test/.env").read(), re.M))
          def post(path, body, token=None):
              req = urllib.request.Request("http://127.0.0.1:8091" + path, data=json.dumps(body).encode(), method="POST",
                                           headers={"Content-Type": "application/json", **({"Authorization": token} if token else {})})
              return json.loads(urllib.request.urlopen(req, timeout=20).read())
          import base64, hashlib, hmac, struct, time
          def totp(secret):
              key = base64.b32decode(secret + "=" * (-len(secret) % 8))
              h = hmac.new(key, struct.pack(">Q", int(time.time() // 30)), hashlib.sha1).digest()
              o = h[19] & 15
              return f"{(struct.unpack('>I', h[o:o + 4])[0] & 0x7fffffff) % 1000000:06d}"
          doc = post("/api/steady/auth/sign-in", {"email": env["CLINICIAN_EMAIL"], "password": env["CLINICIAN_PASSWORD"], "code": totp(env["CLINICIAN_TOTP_SECRET"])})
          assert doc["record"]["role"] == "clinician"
          req = urllib.request.Request("http://127.0.0.1:8091/api/steady/overview", headers={"Authorization": doc["token"]})
          patients = len(json.loads(urllib.request.urlopen(req, timeout=20).read())["patients"])
          print(f"moved: clinician signs in with two-step sign-in and sees {patients} active patient(s)")
          try:
              post("/api/collections/_superusers/auth-with-password", {"identity": env["SUPERUSER_EMAIL"], "password": env["SUPERUSER_PASSWORD"]})
              raise SystemExit("superuser sign-in from outside the container should be refused")
          except urllib.error.HTTPError as err:
              assert err.code == 404, err.code
          req = urllib.request.Request("http://127.0.0.1:8091/_/")
          try:
              urllib.request.urlopen(req, timeout=20)
              raise SystemExit("the dashboard should be closed")
          except urllib.error.HTTPError as err:
              assert err.code == 404, err.code
          print("dashboard closed, superuser sign-in refused from outside the container")
          PY
          # the terminal account tools, for real
          ./accounts.sh check | tee check.txt
          grep -q "proxy header: X-Forwarded-For" check.txt
          grep -q "rate limits: on" check.txt
          ./accounts.sh list | tee list.txt
          grep -q "(master)" list.txt
          grep -Eq "Patients: [1-9]" list.txt
          ./accounts.sh add-admin "CI support" ci-support@steady.test --server-admin | grep -q "Temporary password"
          ./accounts.sh reset ci-support@steady.test | grep -q "Temporary password"
          ./accounts.sh audit --days 1 | grep -q "ops.account.create"
          # the fictional RADR research patients: added with backdated data, then removed again
          ./accounts.sh demo-patients "$(sed -n 's/^CLINICIAN_EMAIL=//p' test/.env)" | tee demo.txt
          grep -q "Added DEMO C" demo.txt
          ./accounts.sh demo-patients "$(sed -n 's/^CLINICIAN_EMAIL=//p' test/.env)" --remove | grep -q "Removed 3"
          SH

      - name: deployment config is valid
        run: |
          fail=0
          note() { echo "::error title=$1::$(sed 's/%/%25/g' "$2" | tail -c 20000 | awk '{printf "%s%%0A", $0}')"; fail=1; }
          docker run --rm -v "$PWD/deploy/test/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile > v1.txt 2>&1 || note "test Caddyfile" v1.txt
          docker run --rm -e STEADY_DOMAIN=steady.example.co.za -e ACME_EMAIL=it@example.co.za \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile > v2.txt 2>&1 || note "production Caddyfile" v2.txt
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config -q > v3.txt 2>&1 || note "production compose" v3.txt
          docker compose -f deploy/docker-compose.yml -f deploy/behind-proxy.yml --env-file deploy/.env.example config -q > v4.txt 2>&1 || note "behind-proxy compose" v4.txt
          sed 's/STEADY_DOMAIN/steady.example.co.za/' deploy/proxy/steady.caddy > site.caddy
          docker run --rm -v "$PWD/site.caddy:/etc/caddy/Caddyfile:ro" caddy:2 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile > v5.txt 2>&1 || note "proxy site Caddyfile" v5.txt
          exit $fail
      - name: server log on failure
        if: failure()
        run: |
          docker compose -f deploy/test/compose.yml --env-file deploy/test/.env logs --no-color pocketbase pusher caddy > pb.log 2>&1 || true
          docker compose -f deploy/test/compose.yml --env-file deploy/test/.env ps -a >> pb.log 2>&1 || true
          (cd deploy && [ -f .env ] && docker compose logs --no-color pocketbase >> ../pb.log 2>&1) || true
          echo "::warning title=server log::$(sed 's/%/%25/g; s/\r//g' pb.log | tail -c 20000 | awk '{printf "%s%%0A", $0}')"

  pusher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
      - run: cd pusher && go vet ./... && go test ./...

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Each step reports its full output as one annotation, so it can be read with
      # `gh run view` even where log downloads aren't available.
      - name: pub get
        working-directory: app
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee ../pubget.txt || { echo "::error title=flutter pub get::$(sed 's/%/%25/g' ../pubget.txt | tail -c 60000 | awk '{printf "%s%%0A", $0}')"; exit 1; }
      - name: analyze
        working-directory: app
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee ../analyze.txt || { echo "::error title=flutter analyze::$(sed 's/%/%25/g' ../analyze.txt | tail -c 60000 | awk '{printf "%s%%0A", $0}')"; exit 1; }
          if ! grep -q "No issues found" ../analyze.txt; then
            echo "::notice title=flutter analyze (infos)::$(sed 's/%/%25/g' ../analyze.txt | tail -c 60000 | awk '{printf "%s%%0A", $0}')"
          fi
      - name: test
        working-directory: app
        run: |
          set -o pipefail
          flutter test 2>&1 | tee ../test.txt || { echo "::error title=flutter test::$(sed 's/%/%25/g' ../test.txt | tail -c 60000 | awk '{printf "%s%%0A", $0}')"; exit 1; }

  android:
    # Builds the Android app (unsigned debug, nothing published) so a plugin or Android setting
    # that doesn't compile shows up on every push, not only when a release is built.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: build apk
        working-directory: app
        timeout-minutes: 30
        run: |
          set -o pipefail
          flutter create --org za.co.openworks --project-name steady --platforms android . > ../create.txt 2>&1
          rm -f test/widget_test.dart
          python3 scripts/patch_android.py 2>&1 | tee ../patch.txt
          grep -q 'Theme.AppCompat' android/app/src/main/res/values/styles.xml || { echo "::error title=patch_android::LaunchTheme isn't AppCompat"; exit 1; }
          flutter build apk --debug --target-platform android-arm64 2>&1 | tee ../apk.txt || { echo "::error title=flutter build apk::$(sed 's/%/%25/g' ../apk.txt | tail -c 60000 | awk '{printf "%s%%0A", $0}')"; exit 1; }
