# Builds the iPhone app on one of GitHub's Mac machines. Run it by hand (Actions > iOS build >
# Run workflow): Mac build time is billed for this private repository, so it doesn't run on
# every change.
#
# With the App Store Connect secrets set, the build is signed and uploaded to TestFlight. Without
# them it is a compile check only (unsigned), so the iOS side can be tested before Apple is set up.
# Secrets (Settings > Secrets and variables > Actions), see docs/APP.md, "iPhone builds":
#   APP_STORE_KEY_ID, APP_STORE_ISSUER_ID, APP_STORE_KEY (.p8 text), IOS_CERT_KEY (RSA key)
# Optional variable IOS_BETA_GROUP: the TestFlight group each new build is given to.
# SPDX-License-Identifier: AGPL-3.0-or-later
name: iOS build
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    # Xcode 26 / iOS 26 SDK: required for App Store Connect uploads since April 2026
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HAS_KEYS: ${{ secrets.APP_STORE_KEY_ID != '' && secrets.APP_STORE_ISSUER_ID != '' && secrets.APP_STORE_KEY != '' && secrets.IOS_CERT_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: tools
        run: |
          xcodebuild -version
          flutter --version

      - name: generate the iOS project
        working-directory: app
        run: |
          flutter create --org za.co.openworks --project-name steady --platforms ios . > ../create.txt 2>&1 || { cat ../create.txt; exit 1; }
          rm -f test/widget_test.dart
          python3 scripts/patch_ios.py

      - name: build number
        run: |
          echo "STEADY_BUILD=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "STEADY_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          # every upload to Apple needs a higher build number than the last
          echo "IOS_BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "IOS_VERSION=$(grep '^version:' app/pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')" >> "$GITHUB_ENV"

      - name: compile check (no signing)
        if: env.HAS_KEYS != 'true'
        working-directory: app
        run: |
          set -o pipefail
          echo "::notice title=iOS build::No App Store Connect secrets: compiling without signing. Nothing is uploaded."
          flutter build ios --release --no-codesign \
            --build-name=$IOS_VERSION --build-number=$IOS_BUILD_NUMBER \
            --dart-define=STEADY_BUILD=$STEADY_BUILD --dart-define=STEADY_BUILD_DATE=$STEADY_BUILD_DATE 2>&1 | tee ../ios.txt \
            || { echo "::error title=flutter build ios::$(sed 's/%/%25/g' ../ios.txt | grep -iE 'error|failed' | tail -c 20000 | awk '{printf "%s%%0A", $0}')"; exit 1; }

      - name: what was built
        if: env.HAS_KEYS != 'true'
        working-directory: app
        run: |
          app=build/ios/iphoneos/Runner.app
          name=$(plutil -extract CFBundleDisplayName raw $app/Info.plist)
          min=$(plutil -extract MinimumOSVersion raw $app/Info.plist)
          ent=$(grep -c 'CODE_SIGN_ENTITLEMENTS' ios/Runner.xcodeproj/project.pbxproj)
          echo "::notice title=iOS compile check::$name $IOS_VERSION ($IOS_BUILD_NUMBER), $(du -sh $app | cut -f1), iOS $min and up, entitlements on $ent configurations, $(xcodebuild -version | head -1)"

      - name: signing
        if: env.HAS_KEYS == 'true'
        working-directory: app
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_KEY }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.IOS_CERT_KEY }}
        run: |
          # Codemagic's CLI tools (GPL-3.0): makes or reuses the distribution certificate and the
          # App Store profile through the App Store Connect API, and sets them on the project
          # each command's own message goes into the run's summary if it fails
          run() {
            "$@" > ../step.txt 2>&1 && { cat ../step.txt; return 0; }
            cat ../step.txt
            echo "::error title=$1 $2::$(sed 's/%/%25/g' ../step.txt | tail -c 6000 | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
          # the shape of each secret, without showing it: a typo is named rather than a bare 401
          bad=""
          printf '%s' "$APP_STORE_CONNECT_KEY_IDENTIFIER" | grep -Eq '^[A-Z0-9]{10}$' || bad="$bad APP_STORE_KEY_ID (10 letters/digits, no spaces);"
          printf '%s' "$APP_STORE_CONNECT_ISSUER_ID" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' || bad="$bad APP_STORE_ISSUER_ID (xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx, no spaces);"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | grep -q 'BEGIN PRIVATE KEY' && printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | grep -q 'END PRIVATE KEY' || bad="$bad APP_STORE_KEY (the whole .p8, BEGIN and END lines included);"
          [ "$APP_STORE_CONNECT_KEY_IDENTIFIER" != "AF3Y5N6XX9" ] || bad="$bad APP_STORE_KEY_ID is the push key's ID, not the API key's;"
          [ -z "$bad" ] || { echo "::error title=App Store Connect secrets::Check:$bad"; exit 1; }
          echo "::notice title=App Store Connect secrets::Key ID, Issuer ID and key all look the right shape (key ID ends ${APP_STORE_CONNECT_KEY_IDENTIFIER: -2})"
          run pipx install codemagic-cli-tools
          # the tools want a traditional "BEGIN RSA PRIVATE KEY" PEM; openssl genrsa on Linux
          # writes the newer PKCS#8 form, so convert whichever we were given
          key=$(mktemp)
          printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > "$key"
          if ! grep -q 'BEGIN RSA PRIVATE KEY' "$key"; then
            /usr/bin/openssl rsa -in "$key" -out "$key.rsa" 2>/dev/null || openssl rsa -in "$key" -traditional -out "$key.rsa"
            grep -q 'BEGIN RSA PRIVATE KEY' "$key.rsa" || { echo "::error title=IOS_CERT_KEY::Couldn't read IOS_CERT_KEY as an RSA private key. Paste the whole file, BEGIN and END lines included."; exit 1; }
            CERTIFICATE_PRIVATE_KEY=$(cat "$key.rsa")
          fi
          rm -f "$key" "$key.rsa"
          export CERTIFICATE_PRIVATE_KEY
          run keychain initialize
          run app-store-connect fetch-signing-files za.co.openworks.steady --type IOS_APP_STORE --create
          run keychain add-certificates
          run xcode-project use-profiles

      - name: build and sign
        if: env.HAS_KEYS == 'true'
        working-directory: app
        run: |
          set -o pipefail
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist \
            --build-name=$IOS_VERSION --build-number=$IOS_BUILD_NUMBER \
            --dart-define=STEADY_BUILD=$STEADY_BUILD --dart-define=STEADY_BUILD_DATE=$STEADY_BUILD_DATE 2>&1 | tee ../ipa.txt \
            || { echo "::error title=flutter build ipa::$(sed 's/%/%25/g' ../ipa.txt | grep -iE 'error|failed' | tail -c 20000 | awk '{printf "%s%%0A", $0}')"; exit 1; }

      - name: upload to TestFlight
        if: env.HAS_KEYS == 'true'
        working-directory: app
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_KEY }}
          BETA_GROUP: ${{ vars.IOS_BETA_GROUP }}
        run: |
          ipa=$(find build/ios/ipa -name '*.ipa' | head -1)
          if [ -n "$BETA_GROUP" ]; then
            app-store-connect publish --path "$ipa" --testflight --beta-group "$BETA_GROUP" --whats-new "Steady build $STEADY_BUILD"
          else
            app-store-connect publish --path "$ipa"
          fi
          echo "::notice title=TestFlight::Uploaded build $IOS_VERSION ($IOS_BUILD_NUMBER) from $STEADY_BUILD. Apple takes 10-30 minutes to process it."
