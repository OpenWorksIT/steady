name: steady_apns
description: "Minimal Apple Push Notification bridge for Steady: permission, device token, foreground display, taps. No Firebase."
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: SteadyApnsPlugin
