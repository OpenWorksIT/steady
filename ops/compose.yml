# OpenWorks' own server (vps3): the Caddy in front of the fleet view (fleet/) and the community
# forum (community/). It owns ports 80/443, gets the certificates, and passes each site on over
# a Docker network of that site's own (fleet-edge, community-edge): only Caddy is on both, so
# the forum and the fleet view can't reach each other. The sites come straight from the
# repository, so a git pull updates them. See docs/OPS-SERVER.md.
#   cd /opt/steady && sudo docker compose -f ops/compose.yml up -d
# SPDX-License-Identifier: AGPL-3.0-or-later
name: ops
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # whole folders, not single files: git replaces a file on pull, and a single-file mount
    # would keep showing the old one
    command: caddy run --config /etc/caddy/ops/Caddyfile --adapter caddyfile
    volumes:
      - ./:/etc/caddy/ops:ro
      - ../fleet:/etc/caddy/fleet:ro
      - ../community:/etc/caddy/community:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    networks: [fleet, community]

volumes:
  caddy_data:
  caddy_config:

networks:
  # fixed names, so the fleet view (fleet/compose.yml) and the forum (Discourse's launcher,
  # community/community.yml.example) can join theirs
  fleet:
    name: fleet-edge
  community:
    name: community-edge
