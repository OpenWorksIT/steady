# Steady test stack for a PC: server, push relay, and a Cloudflare tunnel for phones.
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Use ./start.sh rather than running this directly; it creates keys and accounts.
#
#   phone ──https──> Cloudflare ──tunnel──> caddy:80 ──> pocketbase:8090 (+ web app)
#                                                         pusher ──> ntfy / Apple
#
# PocketBase's own dashboard is closed. Accounts: ../accounts.sh --test (see docs/DEPLOY.md).

name: steady-test

services:
  pocketbase:
    build: ../../server
    restart: unless-stopped
    environment:
      STEADY_PRACTICE_NAME: ${STEADY_PRACTICE_NAME:-VR Clinical Psychology}
      STEADY_CONSENT_VERSION: test-1
      STEADY_PUSHER_URL: http://pusher:8090
      STEADY_PUSHER_SECRET: ${PUSHER_SECRET}
      STEADY_VAPID_PUBLIC_KEY: ${STEADY_VAPID_PUBLIC_KEY}
      # the Cloudflare tunnel passes the visitor's address in this header
      STEADY_TRUSTED_PROXY_HEADER: Cf-Connecting-Ip
      STEADY_REQUIRE_2FA: ${STEADY_REQUIRE_2FA:-staff}
      # staff link each phone or browser with a code by email; on the test stack the email
      # goes to the mail catcher below (read it at http://localhost:8025)
      STEADY_SMTP_HOST: ${STEADY_SMTP_HOST-mailsink}
      STEADY_SMTP_PORT: ${STEADY_SMTP_PORT:-1025}
      STEADY_MAIL_FROM: noreply@steady.test
      STEADY_INTEGRATION_KEY: ${STEADY_INTEGRATION_KEY:-}
      # this PC's own scripts (start.sh, smoke.py) use the superuser API through the local port;
      # the tunnel and Caddy still block it, and the dashboard stays closed
      STEADY_SUPERUSER_API: open
      TZ: Africa/Johannesburg
    volumes:
      - pb_data:/pb/pb_data
      - ../../server/pb_hooks/content:/pb/pb_hooks/content:ro
      # the web version of the app, served on the same address
      - ./web:/pb/pb_public:ro
    ports:
      - "127.0.0.1:${LOCAL_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Catches the server's email (device codes, account notices): http://localhost:8025
  mailsink:
    image: python:3.12-alpine
    restart: unless-stopped
    command: ["python3", "-u", "/mailsink.py"]
    volumes:
      - ./mailsink.py:/mailsink.py:ro
    ports:
      - "127.0.0.1:${MAIL_PORT:-8025}:8025"

  pusher:
    build: ../../pusher
    restart: unless-stopped
    environment:
      PUSHER_SECRET: ${PUSHER_SECRET}
      VAPID_PRIVATE_KEY_FILE: /secrets/vapid.pem
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:test@example.com}
      APNS_KEY_FILE: ${APNS_KEY_FILE:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-za.co.openworks.steady}
    volumes:
      - ./secrets:/secrets:ro

  # Keeps the PocketBase dashboard off the internet; everything else passes through.
  caddy:
    image: caddy:2
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      pocketbase:
        condition: service_healthy

  # Named tunnel: a fixed address on your own domain. Needs TUNNEL_TOKEN.
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [caddy]
    profiles: [named]

  # Quick tunnel: random trycloudflare.com address, no account. No live updates in the app
  # (Cloudflare doesn't pass Server-Sent Events through quick tunnels) and a new address each start.
  quicktunnel:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://caddy:80
    depends_on: [caddy]
    profiles: [quick]

volumes:
  pb_data:
