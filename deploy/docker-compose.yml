# Steady: server, push relay and HTTPS front door.
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# A VPS that already has a web server on ports 80/443 (e.g. vps1, shared with Shap):
# see behind-proxy.yml and docs/DEPLOY.md, "Sharing a server".
#
#   cp .env.example .env   # fill it in
#   ./gen-keys.sh          # creates secrets/ and prints the values to paste into .env
#   docker compose up -d --build
#
# Only Caddy is exposed. PocketBase and the push relay talk on an internal network.

# each service's log (docker compose logs) is kept to 5 files of 10 MB, not without end
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    logging: *logging
    image: caddy:2.11.7 # pinned: Dependabot proposes updates as pull requests into working
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      STEADY_DOMAIN: ${STEADY_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - pocketbase
    networks: [edge, internal]
    # it only needs its own two volumes and ports 80/443
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

  pocketbase:
    logging: *logging
    build: ../server
    restart: unless-stopped
    # only the practice's own site may call the API from a browser
    command: ["/pb/pocketbase", "serve", "--http=0.0.0.0:8090", "--dir=/pb/pb_data", "--hooksDir=/pb/pb_hooks",
              "--migrationsDir=/pb/pb_migrations", "--automigrate=false", "--origins=https://${STEADY_DOMAIN}"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # at most 512 processes and threads (PocketBase uses a few dozen): code that keeps starting
    # them can't choke the rest of the server
    pids_limit: 512
    environment:
      # only for servers set up before branding moved to deploy/brand (./brand.sh)
      STEADY_PRACTICE_NAME: ${STEADY_PRACTICE_NAME:-}
      STEADY_BRAND_DIR: /pb/brand
      # shown in OpenWorks' fleet view
      STEADY_DOMAIN: ${STEADY_DOMAIN:-}
      # lets deploy/health.sh and a central dashboard read /api/steady/health
      STEADY_MONITOR_KEY: ${STEADY_MONITOR_KEY:-}
      STEADY_FLEET_KEY: ${STEADY_FLEET_KEY:-}
      # the community's Community tab (docs/COMMUNITY.md): the forum, its sign-in bridge and the
      # key this server shares with it; any of them empty switches the tab off
      STEADY_COMMUNITY_URL: ${STEADY_COMMUNITY_URL:-}
      STEADY_COMMUNITY_SIGNIN: ${STEADY_COMMUNITY_SIGNIN:-}
      STEADY_COMMUNITY_KEY: ${STEADY_COMMUNITY_KEY:-}
      STEADY_COMMUNITY_SUPPORT: ${STEADY_COMMUNITY_SUPPORT:-}
      STEADY_PUSHER_URL: http://pusher:8090
      STEADY_PUSHER_SECRET: ${PUSHER_SECRET}
      # the iPhone app: TestFlight public link while in testing, later the App Store link
      STEADY_IOS_URL: ${STEADY_IOS_URL:-}
      STEADY_CRISIS_LINES_JSON: ${STEADY_CRISIS_LINES_JSON:-}
      STEADY_NOTIFICATION_RETENTION_DAYS: ${STEADY_NOTIFICATION_RETENTION_DAYS:-90}
      # Caddy puts the visitor's address here; used for rate limits and the audit log
      STEADY_TRUSTED_PROXY_HEADER: X-Forwarded-For
      # psychologists and administrators sign in with a code from an authenticator app
      STEADY_REQUIRE_2FA: ${STEADY_REQUIRE_2FA:-staff}
      # staff in a web browser: the session belongs to the tab, and its token lasts this many
      # minutes, renewed while the tab is open (server/pb_hooks/lib/sessions.js)
      STEADY_TAB_SESSION_MINUTES: ${STEADY_TAB_SESSION_MINUTES:-60}
      # email to staff: codes to link a new device, and notices about their own account (never
      # about patients). With these set, staff sign in only from devices they've linked.
      STEADY_SMTP_HOST: ${STEADY_SMTP_HOST:-}
      STEADY_SMTP_PORT: ${STEADY_SMTP_PORT:-587}
      STEADY_SMTP_USER: ${STEADY_SMTP_USER:-}
      STEADY_SMTP_PASSWORD: ${STEADY_SMTP_PASSWORD:-}
      STEADY_SMTP_TLS: ${STEADY_SMTP_TLS:-}
      STEADY_MAIL_FROM: ${STEADY_MAIL_FROM:-noreply@steadyapp.co.za}
      STEADY_MAIL_NAME: ${STEADY_MAIL_NAME:-Steady}
      STEADY_DEVICE_LINK: ${STEADY_DEVICE_LINK:-on}
      # the Sorted feed (docs/SORTED.md); empty switches it off
      STEADY_INTEGRATION_KEY: ${STEADY_INTEGRATION_KEY:-}
      # test servers only: the demo patients get a new day every night (accounts.sh demo-patients)
      STEADY_DEMO_DAILY: ${STEADY_DEMO_DAILY:-}
      # the app stores' reviewers' account (docs/REVIEWERS.md): OpenWorks' test server only
      STEADY_REVIEWERS: ${STEADY_REVIEWERS:-off}
      TZ: Africa/Johannesburg
    volumes:
      - pb_data:/pb/pb_data
      # the web app (iPhones, and invite QR codes opened in a browser); ./update.sh fills it
      - ./web:/pb/pb_public:ro
      # the practice's name, tagline and logo, kept out of the code (./brand.sh installs them)
      - ./brand:/pb/brand:ro
      # Settings > Server and updates: requests for deploy/ctl/steady-ctl.sh and its status
      # (set up by deploy/ctl/install.sh; without it the app just says so)
      - /var/lib/steady/ctl/in:/ctl/in
      - /var/lib/steady/ctl/out:/ctl/out:ro
      # edit the consent text without rebuilding
      - ../server/pb_hooks/content:/pb/pb_hooks/content:ro
    networks:
      internal: {}

  pusher:
    logging: *logging
    build: ../pusher
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      PUSHER_SECRET: ${PUSHER_SECRET}
      # Apple (iOS). Leave APNS_KEY_FILE empty to disable.
      APNS_KEY_FILE: ${APNS_KEY_FILE:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
      # Android: Firebase Cloud Messaging, with the service-account key of OpenWorks IT's
      # Firebase project in secrets/fcm.json (docs/DEPLOY.md, step 3a). Without the file the
      # relay still starts; Android phones just get no notifications.
      FCM_CREDENTIALS_FILE: /secrets/fcm.json
    volumes:
      - ./secrets:/secrets:ro
    networks: [internal]

volumes:
  pb_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  internal:
    internal: false # the relay must reach Apple's and Google's push servers
