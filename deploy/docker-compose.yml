# Steady: server, push relay and HTTPS front door.
# SPDX-License-Identifier: AGPL-3.0-or-later
#
#   cp .env.example .env   # fill it in
#   ./gen-keys.sh          # creates secrets/ and prints the values to paste into .env
#   docker compose up -d --build
#
# Only Caddy is exposed. PocketBase and the push relay talk on an internal network.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      STEADY_DOMAIN: ${STEADY_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - pocketbase
    networks: [edge, internal]
    security_opt: ["no-new-privileges:true"]

  pocketbase:
    build: ../server
    restart: unless-stopped
    # only the practice's own site may call the API from a browser
    command: ["/pb/pocketbase", "serve", "--http=0.0.0.0:8090", "--dir=/pb/pb_data", "--hooksDir=/pb/pb_hooks",
              "--migrationsDir=/pb/pb_migrations", "--automigrate=false", "--origins=https://${STEADY_DOMAIN}"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      STEADY_PRACTICE_NAME: ${STEADY_PRACTICE_NAME}
      STEADY_CONSENT_VERSION: ${STEADY_CONSENT_VERSION}
      STEADY_PUSHER_URL: http://pusher:8090
      STEADY_PUSHER_SECRET: ${PUSHER_SECRET}
      STEADY_VAPID_PUBLIC_KEY: ${STEADY_VAPID_PUBLIC_KEY}
      STEADY_CRISIS_LINES_JSON: ${STEADY_CRISIS_LINES_JSON:-}
      STEADY_NOTIFICATION_RETENTION_DAYS: ${STEADY_NOTIFICATION_RETENTION_DAYS:-90}
      # Caddy puts the visitor's address here; used for rate limits and the audit log
      STEADY_TRUSTED_PROXY_HEADER: X-Forwarded-For
      TZ: Africa/Johannesburg
    volumes:
      - pb_data:/pb/pb_data
      # edit the consent text without rebuilding
      - ../server/pb_hooks/content:/pb/pb_hooks/content:ro
    networks: [internal]

  pusher:
    build: ../pusher
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      PUSHER_SECRET: ${PUSHER_SECRET}
      # Apple (iOS). Leave APNS_KEY_FILE empty to disable.
      APNS_KEY_FILE: ${APNS_KEY_FILE:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
      # UnifiedPush (Android). VAPID is optional but recommended.
      VAPID_PRIVATE_KEY_FILE: /secrets/vapid.pem
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      # Firebase is off unless you point this at a service-account file.
      FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE:-}
    volumes:
      - ./secrets:/secrets:ro
    networks: [internal]

volumes:
  pb_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  internal:
    internal: false # the relay must reach Apple and UnifiedPush servers
